name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - virtuenet
  pull_request:
    branches:
      - main
      - virtuenet
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Quality Gates
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: PHP Syntax Check
        run: |
          docker run --rm -v "$PWD/backend:/var/www/html" -w /var/www/html php:8.2-cli sh -c \
            "find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n 1 php -l"

      - name: Composer Install and Unit Tests
        run: |
          docker run --rm -v "$PWD/backend:/var/www/html" -w /var/www/html composer:2 \
            composer install --ignore-platform-reqs --prefer-dist --no-interaction
          docker run --rm -v "$PWD/backend:/var/www/html" -w /var/www/html \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            php:8.2-cli sh -c "cp -n .env.example .env && php artisan key:generate && php artisan test --testsuite=Unit && php artisan test --filter ExampleTest"

  test-frontend:
    name: Frontend Quality Gates
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Next.js Frontend Build
        run: npm run build

  deploy:
    name: Deploy to K3s Cluster
    needs: [test-backend, test-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Backend Image
        run: |
          set -euo pipefail
          REGISTRY="10.43.110.114:5000"
          TAG="${{ github.sha }}"
          docker build -t "${REGISTRY}/leadsy-backend:${TAG}" -t "${REGISTRY}/leadsy-backend:latest" -f backend/Dockerfile.production backend/
          docker push "${REGISTRY}/leadsy-backend:${TAG}"
          docker push "${REGISTRY}/leadsy-backend:latest"

      - name: Build and Push Frontend Image
        run: |
          set -euo pipefail
          REGISTRY="10.43.110.114:5000"
          TAG="${{ github.sha }}"
          docker build -t "${REGISTRY}/leadsy-frontend:${TAG}" -t "${REGISTRY}/leadsy-frontend:latest" -f frontend/Dockerfile.production frontend/
          docker push "${REGISTRY}/leadsy-frontend:${TAG}"
          docker push "${REGISTRY}/leadsy-frontend:latest"

      - name: Rollout to K3s Cluster
        run: |
          set -euo pipefail
          NAMESPACE="leadsy-prod"
          REGISTRY="10.43.110.114:5000"
          TAG="${{ github.sha }}"

          echo "== Current deployment topology in ${NAMESPACE} =="
          kubectl get deployments -n "${NAMESPACE}" \
            -o custom-columns='DEPLOYMENT:.metadata.name,CONTAINERS:.spec.template.spec.containers[*].name,IMAGES:.spec.template.spec.containers[*].image' || true

          # Locate whichever deployment/container currently runs a leadsy-backend image
          # rather than hardcoding a name. Read-only and non-fatal: if the runner may not
          # list deployments, fall back to inspecting deployment/leadsy only.
          DEPLOYMENTS=$(kubectl get deployments -n "${NAMESPACE}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
          if [ -z "${DEPLOYMENTS}" ]; then DEPLOYMENTS="leadsy"; fi

          BACKEND_TARGETS=""
          for DEP in ${DEPLOYMENTS}; do
            CONTAINERS=$(kubectl get deployment "${DEP}" -n "${NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[*].name}' 2>/dev/null || echo "")
            for C in ${CONTAINERS}; do
              IMG=$(kubectl get deployment "${DEP}" -n "${NAMESPACE}" -o jsonpath="{.spec.template.spec.containers[?(@.name=='${C}')].image}" 2>/dev/null || echo "")
              case "${IMG}" in
                *leadsy-backend*) BACKEND_TARGETS="${BACKEND_TARGETS} ${DEP}/${C}" ;;
              esac
            done
          done

          echo "Updating frontend image..."
          kubectl set image deployment/leadsy web="${REGISTRY}/leadsy-frontend:${TAG}" -n "${NAMESPACE}"

          AFFECTED="leadsy"
          for T in ${BACKEND_TARGETS}; do
            DEP="${T%%/*}"
            C="${T##*/}"
            echo "Updating backend image on deployment/${DEP} (container ${C})..."
            kubectl set image "deployment/${DEP}" "${C}=${REGISTRY}/leadsy-backend:${TAG}" -n "${NAMESPACE}"
            case " ${AFFECTED} " in
              *" ${DEP} "*) ;;
              *) AFFECTED="${AFFECTED} ${DEP}" ;;
            esac
          done

          echo "Waiting for rollouts to complete..."
          for DEP in ${AFFECTED}; do
            kubectl rollout status "deployment/${DEP}" -n "${NAMESPACE}" --timeout=180s
          done

          if [ -z "${BACKEND_TARGETS}" ]; then
            echo "::error::Backend image ${REGISTRY}/leadsy-backend:${TAG} was built and pushed, but no deployment in ${NAMESPACE} runs a leadsy-backend image, so the backend was NOT rolled out. Check the topology listing above and wire the backend container into this step."
            exit 1
          fi

      - name: Health Smoke Test
        run: |
          set -euo pipefail
          echo "Verifying leadsy endpoint..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -k https://leadsy.virtuenet.space || true)
          echo "HTTP Status Code: ${STATUS_CODE}"
          if [ "${STATUS_CODE}" -ge 200 ] && [ "${STATUS_CODE}" -lt 500 ]; then
            echo "Smoke test passed! Leadsy is online."
          else
            echo "::warning::Unexpected status code: ${STATUS_CODE}"
          fi

  record:
    name: Record deployment in VirtueDev
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: virtuenet-prasetia/.github/.github/workflows/record-deployment.yml@main
    with:
      app_name: leadsy
      environment: production
      target_namespace: leadsy-prod
      source_commit: ${{ github.sha }}
    secrets: inherit
