name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - virtuenet
  pull_request:
    branches:
      - main
      - virtuenet
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-hygiene:
    name: Runner Hygiene (${{ matrix.runner }})
    runs-on: [self-hosted, in-cluster, k3s]
    strategy:
      matrix:
        runner: [1, 2, 3]
      fail-fast: false
    timeout-minutes: 5
    steps:
      - name: Prune Docker, Temp Files, Inodes, and Runner Workspaces
        run: |
          docker system prune -af --volumes || true
          docker builder prune -af || true
          rm -rf /tmp/runner/work/_temp/* || true
          rm -rf /tmp/runner/work/_actions/* || true
          rm -rf /tmp/runner/work/leadsy/* || true
          rm -rf /tmp/* || true
          df -h
          df -i

  test-backend:
    name: Backend Quality Gates
    needs: runner-hygiene
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: PHP Syntax Check
        run: |
          docker run --rm -v "$PWD/backend:/var/www/html" -w /var/www/html php:8.2.35-cli sh -c \
            "find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n 1 php -l"

      - name: Composer Install and Unit Tests
        run: |
          docker run --rm -v "$PWD/backend:/var/www/html" -w /var/www/html composer:2 \
            composer install --ignore-platform-reqs --prefer-dist --no-interaction
          docker run --rm -v "$PWD/backend:/var/www/html" -w /var/www/html \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            php:8.2.35-cli sh -c "cp -n .env.example .env && php artisan key:generate && php artisan test --testsuite=Unit && php artisan test --filter ExampleTest"

      - name: Clean Workspace Artifacts
        if: always()
        run: |
          rm -rf backend/vendor || true

  test-frontend:
    name: Frontend Quality Gates
    needs: [runner-hygiene, test-backend]
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies and Build
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            node:22.23.4-bookworm \
            bash -lc 'node --version && npm --version && npm ci && npm ci --prefix frontend && npm run build'

      - name: Clean Workspace Artifacts
        if: always()
        run: |
          rm -rf node_modules frontend/node_modules frontend/.next || true
          docker system prune -f || true

  deploy:
    name: Deploy to K3s Cluster
    needs: [test-backend, test-frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Backend Image
        run: |
          set -euo pipefail
          REGISTRY="10.43.110.114:5000"
          TAG="${{ github.sha }}"
          docker build -t "${REGISTRY}/leadsy-backend:${TAG}" -t "${REGISTRY}/leadsy-backend:latest" -f backend/Dockerfile.production backend/
          docker push "${REGISTRY}/leadsy-backend:${TAG}"
          docker push "${REGISTRY}/leadsy-backend:latest"

      - name: Build and Push Frontend Image
        run: |
          set -euo pipefail
          REGISTRY="10.43.110.114:5000"
          TAG="${{ github.sha }}"
          docker build -t "${REGISTRY}/leadsy-frontend:${TAG}" -t "${REGISTRY}/leadsy-frontend:latest" -f frontend/Dockerfile.production frontend/
          docker push "${REGISTRY}/leadsy-frontend:${TAG}"
          docker push "${REGISTRY}/leadsy-frontend:latest"

      - name: Rollout to K3s Cluster
        run: |
          set -euo pipefail
          NAMESPACE="leadsy-prod"
          REGISTRY="10.43.110.114:5000"
          TAG="${{ github.sha }}"

          render() {
            sed "s|__IMAGE_TAG__|${TAG}|g" "$1"
          }

          render_runtime() {
            sed "s|__IMAGE_TAG__|${TAG}|g" "$1" \
              | awk 'BEGIN { skip = 1 } /^---[[:space:]]*$/ { if (skip) { skip = 0; next } print; next } !skip { print }'
          }

          echo "Applying Redis runtime (persistent cache/queue volume only)..."
          render_runtime k8s/leadsy-prod-redis.yaml | kubectl apply -n "${NAMESPACE}" -f -
          kubectl rollout status deployment/leadsy-redis -n "${NAMESPACE}" --timeout=180s

          echo "Applying backend runtime without changing the public backend Service yet..."
          render_runtime k8s/leadsy-prod-backend.yaml | kubectl apply -n "${NAMESPACE}" -f -
          kubectl set image deployment/leadsy-backend backend="${REGISTRY}/leadsy-backend:${TAG}" -n "${NAMESPACE}"
          kubectl rollout status deployment/leadsy-backend -n "${NAMESPACE}" --timeout=300s

          echo "Applying worker and scheduler after the backend is healthy..."
          render k8s/leadsy-prod-workers.yaml | kubectl apply -n "${NAMESPACE}" -f -
          kubectl set image deployment/leadsy-worker worker="${REGISTRY}/leadsy-backend:${TAG}" -n "${NAMESPACE}"
          kubectl set image deployment/leadsy-scheduler scheduler="${REGISTRY}/leadsy-backend:${TAG}" -n "${NAMESPACE}"
          kubectl rollout status deployment/leadsy-worker -n "${NAMESPACE}" --timeout=300s
          kubectl rollout status deployment/leadsy-scheduler -n "${NAMESPACE}" --timeout=300s

          echo "Applying frontend runtime and ingress (leadsy.tech)..."
          render k8s/leadsy-prod-frontend.yaml | kubectl apply -n "${NAMESPACE}" -f -
          kubectl set image deployment/leadsy web="${REGISTRY}/leadsy-frontend:${TAG}" -n "${NAMESPACE}"
          kubectl rollout status deployment/leadsy -n "${NAMESPACE}" --timeout=180s

          rollback_backend_service() {
            echo "Rolling public backend Service back to the existing endpoint..."
            kubectl patch service/backend -n "${NAMESPACE}" --type=merge \
              -p '{"spec":{"selector":null,"ports":[{"name":"http","port":8000,"protocol":"TCP","targetPort":32080}]}}' || true
          }
          trap rollback_backend_service ERR

          echo "Cutting the existing backend Service over to the healthy Kubernetes backend..."
          kubectl patch service/backend -n "${NAMESPACE}" --type=merge \
            -p '{"spec":{"selector":{"app":"leadsy-backend"},"ports":[{"name":"http","port":8000,"protocol":"TCP","targetPort":8000}]}}'
          kubectl wait --for=condition=ready pod -l app=leadsy-backend -n "${NAMESPACE}" --timeout=60s
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused --max-time 30 https://leadsy.tech/api/health
          trap - ERR
          echo "Kubernetes backend is serving the public API."

      - name: Health Smoke Test
        run: |
          set -euo pipefail
          echo "Verifying public frontend and backend endpoints at https://leadsy.tech..."
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused --max-time 30 -o /dev/null https://leadsy.tech/
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused --max-time 30 https://leadsy.tech/api/health
          echo "Verifying 301 redirect from https://leadsy.virtuenet.space..."
          REDIRECT_CODE="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 30 https://leadsy.virtuenet.space/)"
          if [ "${REDIRECT_CODE}" != "301" ] && [ "${REDIRECT_CODE}" != "308" ]; then
            echo "Expected HTTP 301 or 308 from https://leadsy.virtuenet.space/, got ${REDIRECT_CODE}" >&2
            exit 1
          fi
          echo "Smoke test passed: https://leadsy.tech is online and leadsy.virtuenet.space redirects with ${REDIRECT_CODE}."

  deploy-staging:
    name: Deploy to Staging Namespace (K3s)
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/virtuenet'
    runs-on: [self-hosted, in-cluster, k3s]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Staging Images
        run: |
          set -euo pipefail
          REGISTRY="10.43.110.114:5000"
          TAG="staging-${{ github.sha }}"
          docker build -t "${REGISTRY}/leadsy-backend:${TAG}" -t "${REGISTRY}/leadsy-backend:staging-latest" -f backend/Dockerfile.production backend/
          docker push "${REGISTRY}/leadsy-backend:${TAG}"
          docker push "${REGISTRY}/leadsy-backend:staging-latest"

          docker build -t "${REGISTRY}/leadsy-frontend:${TAG}" -t "${REGISTRY}/leadsy-frontend:staging-latest" -f frontend/Dockerfile.production frontend/
          docker push "${REGISTRY}/leadsy-frontend:${TAG}"
          docker push "${REGISTRY}/leadsy-frontend:staging-latest"

      - name: Rollout to Staging Namespace
        run: |
          set -euo pipefail
          NAMESPACE="leadsy-staging"
          REGISTRY="10.43.110.114:5000"
          TAG="staging-${{ github.sha }}"

          render() {
            sed "s|__IMAGE_TAG__|${TAG}|g" "$1"
          }

          echo "Applying staging manifests..."
          render k8s/leadsy-staging.yaml | kubectl apply -f -
          kubectl rollout status deployment/leadsy-staging-frontend -n "${NAMESPACE}" --timeout=180s || true

  record:
    name: Record deployment in VirtueDev
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: virtuenet-prasetia/.github/.github/workflows/record-deployment.yml@main
    with:
      app_name: leadsy
      environment: production
      target_namespace: leadsy-prod
      source_commit: ${{ github.sha }}
      image: 10.43.110.114:5000/leadsy-frontend:${{ github.sha }}
      rollout_status: success
      smoke_http_status: "200"
    secrets: inherit
